[package]
name = "valua_edge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
valua_core = { path = "../valua_core" }
uniffi = { version = "0.27", features = ["build", "cli"] }

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }
